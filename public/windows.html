<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星空之门 (Stargate) - Windows 官方版本下载</title>
  <meta name="description" content="星空之门 / Stargate Windows 客户端高速下载，畅享极速、稳定与探索未知的奇幻体验。" />
  <style>
    /* 全局与变量定义 */
    :root {
      --primary: #00d2ff;
      --primary-glow: rgba(0, 210, 255, 0.45);
      --secondary: #9d4edd;
      --secondary-glow: rgba(157, 78, 221, 0.35);
      --bg-dark: #070913;
      --card-bg: rgba(18, 24, 46, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f0f4fc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 星空 Canvas 背景层 */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 星云流光背景氛围 */
    .nebula-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65vw;
      height: 65vh;
      background: radial-gradient(circle, var(--secondary-glow) 0%, var(--primary-glow) 35%, transparent 70%);
      filter: blur(90px);
      z-index: 1;
      opacity: 0.6;
      pointer-events: none;
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.45; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.75; }
    }

    /* 页面主要容器 */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 顶部徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 210, 255, 0.3);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 24px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 标题区域 */
    .title-group {
      margin-bottom: 20px;
    }

    h1.main-title {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #ffffff 20%, #b4e0ff 60%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-shadow: 0 4px 30px rgba(0, 210, 255, 0.2);
    }

    .sub-title {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* 核心卡片 */
    .download-card {
      width: 100%;
      margin: 36px 0;
      padding: 40px 32px;
      border-radius: 24px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.3s ease;
    }

    .download-card:hover {
      border-color: rgba(0, 210, 255, 0.35);
    }

    /* 下载按钮 */
    .download-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 48px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #00b4d8 0%, #7209b7 100%);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 180, 216, 0.4), 0 0 20px rgba(114, 9, 183, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      overflow: hidden;
    }

    .download-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 40px rgba(0, 180, 216, 0.55), 0 0 30px rgba(114, 9, 183, 0.4);
    }

    .download-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .download-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    /* 版本信息说明 */
    .version-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 22px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-item svg {
      width: 14px;
      height: 14px;
      stroke: var(--primary);
    }

    /* 特性小卡片网格 */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      width: 100%;
      margin-top: 10px;
    }

    .feature-item {
      padding: 22px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      text-align: left;
      transition: transform 0.2s, background 0.2s;
    }

    .feature-item:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.05);
    }

    .feature-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(0, 210, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .feature-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .feature-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 页脚 */
    footer {
      position: relative;
      z-index: 2;
      padding: 30px;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--primary);
    }

    /* 移动端微调 */
    @media (max-width: 600px) {
      .download-card {
        padding: 30px 20px;
      }
      .download-btn {
        width: 100%;
        padding: 16px 24px;
        font-size: 1.1rem;
      }
      .version-meta {
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- 星空粒子动效脚本 -->
  <script>
    (function () {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const numStars = 160;
      let width = 0;
      let height = 0;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      function createStars() {
        stars = [];
        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.8 + 0.4,
            speed: Math.random() * 0.4 + 0.1,
            alpha: Math.random() * 0.8 + 0.2,
            alphaSpeed: (Math.random() - 0.5) * 0.015
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];

          // 恒星呼吸闪烁
          s.alpha += s.alphaSpeed;
          if (s.alpha <= 0.1 || s.alpha >= 0.9) {
            s.alphaSpeed = -s.alphaSpeed;
          }

          // 缓慢上升流动
          s.y -= s.speed;
          if (s.y < 0) {
            s.y = height;
            s.x = Math.random() * width;
          }

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(220, 240, 255, ${Math.max(0, s.alpha)})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', () => {
        resize();
        createStars();
      });

      resize();
      createStars();
      draw();
    })();
  </script>
